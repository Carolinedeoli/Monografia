<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ENEM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="filtro-container-wrapper">
        <button id="btnFiltros" class="btn-filtros-novo" onclick="toggleFiltros()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" 
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" 
            y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" 
            y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line 
            x1="20" y1="12" x2="20" y2="3"></line><line x1="2" y1="14" x2="6" y2="14"></line><line x1="10" y1="8" x2="14" 
            y2="8"></line><line x1="18" y1="16" x2="22" y2="16">
            </line>
            </svg> 
            Filtros
        </button>

        <div class="filtros-card" id="menuFiltros">
            
            <button class="btn-limpar-filtros" onclick="limparFiltrosAtivos()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" 
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" 
                cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15">
                </line>
                </svg>
                Limpar Filtros
            </button>

            <div class="filtro-grupo">
                <label class="filtro-titulo">Ano</label>
                <div class="periodo-flex">
                    <select id="filtroAno" class="filtro-select-ano">
                    </select>
                </div>
            </div>

            <div class="filtro-grupo">
                <label class="filtro-titulo">UF</label>
                <div class="checkbox-lista" id="filtroUF">
                    </div>
            </div>

            <div class="filtro-grupo">
                <label class="filtro-titulo">Escola</label>
                <div class="checkbox-lista" id="filtroEscola">
                    </div>
            </div>

            <div class="filtro-grupo">
                <label class="filtro-titulo">Dependência</label>
                <div class="checkbox-lista" id="filtroDepAdm">
                    </div>
            </div>

        </div>
    </div>

    <h1>Estatísticas Gerais</h1>

    <div class="cards">
        <div class="card">
            <h3>Inscritos</h3>
            <p id="totalInscritos">0</p>
        </div>

        <div class="card">
            <h3>Participantes <span class="info" title="Participantes presentes am ambos os dias e redação válida.">ⓘ</span></h3>
            <p id="totalParticipantes">0</p>
        </div>

        <div class="card">
            <h3>% Participantes <span class="info" title="Porcentagem de participantes presentes am ambos os dias e redação válida com relação ao total de inscritos.">ⓘ</span></h3>
            <p id="percentParticipacao">0%</p>
        </div>

        <div class="card">
            <h3>% Redações Válidas <span class="info" title="Percentual de redações válidas entre os presentes no primeiro dia.">ⓘ</span></h3>
            <p id="percentRedacoesValidas">0%</p>
        </div>

        <div class="card">
            <h3>Média Participantes por Ano</h3>
            <p id="mediaParticipantesAno">0</p>
            <small id="notaMediaAnos"></small>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="painel-esquerda">
            <div class="grafico-box">
                <h2>Evolução de Inscritos e Participantes</h2>
                <div id="graficoInscritos" class="grafico"></div>
            </div>
            <div class="grafico-box">
                <h2>Presença e Redações Válidas</h2>
                <div id="graficoPresenca" class="grafico"></div>
            </div>
        </div>

        <div class="painel-direita">
            <div class="tabela-container">
                <h2>Status da Redação</h2>
                <table id="tabelaRedacao">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Quantidade</th>
                            <th>% Inscritos</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script src="js/filtros.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/graficos.js"></script>
    <script src="js/tabelas.js"></script>
    <script src="script.js"></script>
</body>

</html>
